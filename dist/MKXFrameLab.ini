; =============================================================================
;  MKX Frame Lab - configuration
;  Put this file next to MKXFrameLab.asi in Mortal Kombat X\Binaries\Retail
;  Reload in game: menu (F2) > Config > Reload MKXFrameLab.ini
; =============================================================================
;
;  ADDRESS EXPRESSIONS (Cheat Engine style, all numbers are hex)
;    rva:2F0A3C8                 module base + 0x2F0A3C8 ("MK10.exe"+2F0A3C8 in CE)
;    abs:7FF612340000            absolute address (changes every launch - avoid)
;    sig("48 8B 05 ?? ?? ?? ??",3)  AOB scan; ",3" = RIP-relative disp at +3
;    self / p1 / p2              owner object / player 1 / player 2
;    [ expr ]                    read 8-byte pointer
;    expr + 1A0                  add offset
;  A CE pointer  "MK10.exe"+2F0A3C8 -> 10 -> 88   is written   [[rva:2F0A3C8]+10]+88
;  Leave a value empty to disable that feature.
;  NOTE: comments must start a line, or be preceded by " ;" (space-semicolon).
; =============================================================================

[General]
; Demo=1 shows a scripted frame meter and test shapes so you can confirm the
; overlay loads before any offsets are known. Set to 0 once Players are filled in.
Demo=0
StartVisible=1
MenuScale=1.0
; Virtual-key codes (0x71=F2 0x72=F3 0x73=F4 0x74=F5 0x75=F6)
MenuKey=0x71
BoxesKey=0x72
MeterKey=0x73
PauseKey=0x74
StepKey=0x75

; int32 that increments once per gameplay frame. Makes the meter exact and
; frame-step precise. Without it a 60 Hz clock is used.
FrameCounter=

; float global game speed (1.0 = normal). Enables real pause / frame-step.
; MKXHook's "Speed Modifier" writes this value - find it the same way.
GameSpeed=

; Optional practice-only lock: int32 game-mode value and the value it has in Practice.
; When set, the overlay draws nothing outside that mode.
ModeCheck=
ModeValue=0

[Players]
; Address of each fighter's character object.
P1=
P2=

[Fields]
; All relative to the player object: use  self+OFFSET
; float world position (UE3: X forward, Y right, Z up)
PosX=
PosY=
PosZ=
; int32 current move/state id
State=
; int32 frame counter inside the current move
MoveFrame=
; int32 nonzero when the player can act (best signal for advantage)
Actionable=
; Alternative to Actionable: comma list of State values that mean "neutral"
IdleStates=
; int32 nonzero during active frames (or leave empty and use a Kind=hit box source)
AttackActive=
; int32 frames of hitstun / blockstun remaining
Hitstun=
Blockstun=

[Camera]
; ue3    = position (3 floats) + rotator (3 int32, 65536 = 360 deg) + FOV
; matrix = 16-float view-projection matrix
; none   = no shape drawing
Mode=none
Pos=
Rot=
Fov=
; used when Fov is empty (degrees, horizontal)
FovFixed=90
Matrix=
; row (D3D style) or col
MatrixLayout=row

; -----------------------------------------------------------------------------
;  SHAPE SOURCES  [Box0] ... [Box31]
;  Each describes an array of collision shapes in memory.
;    Owner     1 or 2 (what "self" means in Array/Count)
;    Kind      hurt | hit | throw | push | other   (color + filter)
;    Shape     sphere | capsule | box
;    Array     address of the first element (or of an array of pointers)
;    Indirect  1 if Array holds pointers to elements
;    Count     int32 expression, or CountFixed=N
;    Stride    element size in bytes (hex)
;    X Y Z     float offsets inside the element (hex). Capsule: X2 Y2 Z2 too.
;    Radius    float offset, or RadiusFixed=value.  Box: HalfX HalfY HalfZ.
;    ActiveField  int32 offset, nonzero = active (inactive drawn faint)
;    ActiveOnly   1 = skip inactive elements entirely
;    Scale     multiply radius / extents
;  Delete the leading ";" on a block to enable it.
; -----------------------------------------------------------------------------

;[Box0]
;Name=P1 hurt spheres
;Owner=1
;Kind=hurt
;Shape=sphere
;Array=[self+0]
;Count=self+0
;Stride=40
;X=0
;Y=4
;Z=8
;Radius=C

;[Box1]
;Name=P2 hurt spheres
;Owner=2
;Kind=hurt
;Shape=sphere
;Array=[self+0]
;Count=self+0
;Stride=40
;X=0
;Y=4
;Z=8
;Radius=C

;[Box2]
;Name=P1 attack
;Owner=1
;Kind=hit
;Shape=capsule
;Array=[self+0]
;CountFixed=4
;Stride=50
;X=0
;Y=4
;Z=8
;X2=C
;Y2=10
;Z2=14
;Radius=18
;ActiveField=1C

[Colors]
; RRGGBBAA
Hurt=3C8CFFB4
Hit=FF3030D0
Throw=FFD020C0
Push=B0B0B080
Other=30FF60B0
