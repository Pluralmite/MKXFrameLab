; =============================================================================
;  MKX Frame Lab v1.0 - settings
;  Lives next to MKXFrameLab.asi in  Mortal Kombat X\Binaries\Retail
;  Everything else is set in game from the F2 menu.
; =============================================================================

[General]
; Open the advanced settings window when the game starts (1 = yes)
StartVisible=0
; Size of the advanced settings window text
MenuScale=1.0
; Detailed per-hit diagnostics in MKXFrameLab.log (only needed for bug reports)
VerboseLog=0
; Hotkeys (virtual-key codes): 0x71 = F2, 0x72 = F3, 0x73 = F4, 0x74 = F5, 0x75 = F6
MenuKey=0x71
BoxesKey=0x72
MeterKey=0x73
PauseKey=0x74
StepKey=0x75
Demo=0
